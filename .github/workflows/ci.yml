name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests (no install needed — zero dependencies)
        run: node --test tests/*.test.js

      - name: Verify plugin manifest contract
        run: node tools/check-manifest.js

      # The whole point of the plugin is a round trip between two machines.
      # CI proves it end to end with no credential and no network: export from
      # a fake desktop file, import on the "phone" side, read the state back.
      - name: Round trip export → import → status in one shell
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          export DSH_HOME="$work/dsh"
          export NO_COLOR=1
          mkdir -p "$work/desktop"
          cat > "$work/desktop/workbuddy-desktop.info" <<'JSON'
          {
            "auth": {
              "accessToken": "ci-access-token",
              "refreshToken": "ci-refresh-token",
              "domain": "www.workbuddy.cn",
              "expiresAt": 4102444800
            },
            "account": { "uid": "ci-uid", "nickname": "CI" }
          }
          JSON

          token="$(node tools/cli.js export --file "$work/desktop/workbuddy-desktop.info" 2>"$work/export.err")"
          case "$token" in
            wb1.*) echo "export produced a token (${#token} chars)" ;;
            *) echo "export did not produce a token: $token"; exit 1 ;;
          esac
          grep -q '导出成功' "$work/export.err"

          node tools/cli.js import --token "$token"
          node tools/cli.js status --json > "$work/status.json"
          node -e '
            const s = require("node:fs").readFileSync(process.argv[1], "utf8");
            const j = JSON.parse(s);
            if (j.state !== "ready") { console.error("expected ready, got " + j.state); process.exit(1); }
            if (j.credential.nickname !== "CI") { console.error("nickname lost"); process.exit(1); }
            if (/ci-access-token|ci-refresh-token/.test(s)) { console.error("status leaked a token"); process.exit(1); }
            console.log("status: ready, identity preserved, no token leak");
          ' "$work/status.json"

          node tools/cli.js forget --yes
          rm -rf "$work"

      # Path one: read the token out of the phone's own MMKV file. A real device
      # is not available here, so the bytes are constructed exactly the way MMKV
      # lays them out and pushed through the real parser and the real extractor.
      - name: Parse a phone MMKV file end to end
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { writeFile } from "node:fs/promises";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            import { parseMmkv } from "./lib/mmkv.js";
            import { credentialFromEntries } from "./lib/phone.js";

            // Backslash escapes are not available inside this single-quoted
            // shell literal, so every byte is built with Buffer.from.
            const varint = (n) => {
              const out = [];
              let rest = n;
              do {
                let byte = rest % 128;
                rest = Math.floor(rest / 128);
                if (rest > 0) byte |= 0x80;
                out.push(byte);
              } while (rest > 0);
              return Buffer.from(out);
            };
            const entry = (key, value) => {
              const k = Buffer.from(key, "utf8");
              return Buffer.concat([varint(k.length), k, varint(value.length), value]);
            };
            const expires = Buffer.alloc(8);
            expires.writeBigInt64LE(BigInt(Date.now() + 86400000), 0);
            const body = Buffer.concat([
              varint(0),                                    // placeholder item size
              entry("workbuddy_token", Buffer.from("ci-phone-access", "utf8")),
              entry("workbuddy_refresh_token", Buffer.from("ci-phone-refresh", "utf8")),
              entry("workbuddy_token_expire_at", expires),
              // The real app key is `workbuddy_user` holding a JSON blob; the
              // uid has to be extracted from it.
              entry("workbuddy_user", Buffer.from(JSON.stringify({ uid: "ci-phone-uid", nickname: "CI" }), "utf8")),
            ]);
            const header = Buffer.alloc(4);
            header.writeUInt32LE(body.length, 0);

            const path = join(tmpdir(), "ci-mmkv.default");
            await writeFile(path, Buffer.concat([header, body]));

            const parsed = parseMmkv(await (await import("node:fs/promises")).readFile(path));
            if (!parsed.complete) { console.error("parse did not complete"); process.exit(1); }
            const credential = credentialFromEntries(parsed.entries);
            if (credential.accessToken !== "ci-phone-access") { console.error("wrong access token"); process.exit(1); }
            if (credential.refreshToken !== "ci-phone-refresh") { console.error("wrong refresh token"); process.exit(1); }
            if (credential.uid !== "ci-phone-uid") { console.error("uid not extracted from the user blob"); process.exit(1); }
            if (!(credential.expiresAtMs > Date.now())) { console.error("expiry not read as a future time"); process.exit(1); }
            console.log("mmkv: " + parsed.layout + " layout, " + parsed.entries.size + " keys, token extracted");
          '

      # On a machine with no DSHA device shell, capture must say so politely
      # instead of throwing or pretending it worked.
      - name: Capture reports a missing device shell instead of crashing
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          export DSH_HOME="$work/dsh"
          export NO_COLOR=1
          set +e
          node tools/cli.js capture --dry-run > "$work/out" 2> "$work/err"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 without a device shell, got $code"
            cat "$work/out" "$work/err"
            exit 1
          fi
          if grep -qiE 'at .*\.js:|TypeError|ReferenceError' "$work/err"; then
            echo "capture leaked a stack trace:"; cat "$work/err"; exit 1
          fi
          echo "capture failed cleanly without a device shell"
          rm -rf "$work"
